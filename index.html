<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل نغمة m&ms_ringtone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f111a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1d28;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 231, 255, 0.1);
            border: 1px solid #2a2e3d;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .dj-image {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.6));
            object-fit: contain;
        }
        h1 {
            color: #00e7ff;
            font-size: 22px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 231, 255, 0.3);
        }
        audio {
            width: 100%;
            margin-bottom: 25px;
            filter: invert(0.9) hue-rotate(180deg);
        }
        .btn-download {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #00e7ff 0%, #0072ff 100%);
            color: #ffffff;
            padding: 14px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 231, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ضع اسم صورة الـ PNG الخاصة بك هنا -->
        <img src="dj_person.png" alt="DJ Image" class="dj-image">

        <h1>نغمة الرنين: m&ms_ringtone</h1>
        
        <!-- مشغل الصوت -->
        <audio controls>
            <source src="m&ms_ringtone.mp3" type="audio/mpeg">
            متصفحك لا يدعم مشغل الصوت.
        </audio>

        <!-- زر التحميل المباشر -->
        <a href="m&ms_ringtone.mp3" download="m&ms_ringtone.mp3" class="btn-download">
            تحميل النغمة الآن
        </a>
    </div>

</body>
</html>
