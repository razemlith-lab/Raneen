<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل نغمة m&ms_ringtone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1b2238 0%, #0b0e17 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(26, 29, 40, 0.85);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 231, 255, 0.15);
            border: 1px solid rgba(0, 231, 255, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        /* إطار مضيء حول الصورة */
        .image-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        .image-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 10px;
            background: #00e7ff;
            filter: blur(15px);
            opacity: 0.6;
        }
        .dj-image {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.7));
            object-fit: contain;
            position: relative;
            z-index: 2;
        }
        .badge {
            display: inline-block;
            background: rgba(0, 231, 255, 0.1);
            color: #00e7ff;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            border: 1px solid rgba(0, 231, 255, 0.3);
            letter-spacing: 1px;
        }
        h1 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        h1 span {
            color: #00e7ff;
            text-shadow: 0 0 10px rgba(0, 231, 255, 0.4);
        }
        audio {
            width: 100%;
            margin-bottom: 25px;
            filter: invert(0.92) hue-rotate(180deg);
            border-radius: 8px;
        }
        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #00e7ff 0%, #0072ff 100%);
            color: #ffffff;
            padding: 14px 24px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 231, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="image-container">
            <img src="dj_person.png" alt="DJ Image" class="dj-image">
        </div>

        <div class="badge">EXCLUSIVE RINGTONE</div>
        <h1>نغمة الرنين: <span>m&ms_ringtone</span></h1>
        
        <!-- مشغل الصوت -->
        <audio controls>
            <source src="m&ms_ringtone.mp3" type="audio/mpeg">
            متصفحك لا يدعم مشغل الصوت.
        </audio>

        <!-- زر التحميل المباشر -->
        <a href="m&ms_ringtone.mp3" download="m&ms_ringtone.mp3" class="btn-download">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            تحميل النغمة الآن
        </a>
    </div>

</body>
</html>
